  <text x="160" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="160" font-weight="900" fill="white" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Helvetica, Arial, sans-serif;font-size:160px;font-weight:900;text-anchor:middle;dominant-baseline:auto">S</text>

