  <text x="255" y="140" dominant-baseline="central" font-family="Helvetica Rounded, Arial Rounded MT Bold, Arial, sans-serif" font-size="148" font-weight="900" fill="#111111" letter-spacing="2" style="fill:rgb(17, 17, 17);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Rounded&quot;, &quot;Arial Rounded MT Bold&quot;, Arial, sans-serif;font-size:148px;font-weight:900;text-anchor:start;dominant-baseline:central">AIM</text>

