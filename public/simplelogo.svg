  <!-- Octagon avec bords arrondis via path -->
  <path d="&#10;    M 128,40&#10;    L 192,40&#10;    Q 200,40 206,46&#10;    L 234,74&#10;    Q 240,80 240,88&#10;    L 240,192&#10;    Q 240,200 234,206&#10;    L 206,234&#10;    Q 200,240 192,240&#10;    L 128,240&#10;    Q 120,240 114,234&#10;    L 86,206&#10;    Q 80,200 80,192&#10;    L 80,88&#10;    Q 80,80 86,74&#10;    L 114,46&#10;    Q 120,40 128,40&#10;    Z&#10;  " fill="url(#blueGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

