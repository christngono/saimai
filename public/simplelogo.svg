  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4BB8E8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A7DB5;stop-opacity:1"/>
